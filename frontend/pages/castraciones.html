<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysRefugios - Castraciones</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header id="encabezado" class="encabezado"></header>

    <main class="contenedor">
        <div class="barra-herramientas">
            <h1>Castraciones</h1>
            <button id="boton-nuevo" class="boton" type="button">Nueva castración</button>
        </div>
        <p class="subtitulo">
            Historial de castraciones por animal (incluye tanto las realizadas en campañas
            como las derivadas de un compromiso de adopción).
        </p>

        <div id="mensaje-error" class="alerta alerta-error" hidden></div>
        <div id="mensaje-exito" class="alerta alerta-exito" hidden></div>

        <section id="tarjeta-formulario" class="tarjeta" hidden>
            <h2 id="titulo-formulario" style="margin-top:0;">Nueva castración</h2>
            <form id="formulario-castracion">
                <input type="hidden" id="castracionId">
                <div class="fila-campos">
                    <div class="campo">
                        <label for="animalId">Animal *</label>
                        <select id="animalId" required></select>
                    </div>
                    <div class="campo">
                        <label for="fecha">Fecha *</label>
                        <input type="date" id="fecha" required>
                    </div>
                    <div class="campo">
                        <label for="veterinario">Veterinario *</label>
                        <input type="text" id="veterinario" maxlength="150" required>
                    </div>
                </div>
                <div class="campo">
                    <label for="observaciones">Observaciones</label>
                    <textarea id="observaciones"></textarea>
                </div>
                <div class="acciones-formulario">
                    <button type="submit" class="boton">Guardar</button>
                    <button type="button" id="boton-cancelar" class="boton boton-secundario">Cancelar</button>
                </div>
            </form>
        </section>

        <div class="tarjeta">
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Animal</th>
                            <th>Fecha</th>
                            <th>Veterinario</th>
                            <th>Observaciones</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla"></tbody>
                </table>
                <p id="tabla-vacia" class="vacio" hidden>No hay castraciones registradas todavía.</p>
            </div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/etiquetas.js"></script>
    <script>
        const sesion = inicializarPagina("castraciones.html");

        if (sesion) {
            iniciar();
        }

        async function iniciar() {
            await cargarAnimales();
            await cargarTabla();
        }

        async function cargarAnimales() {
            const animales = await api.get(`/animales?organizacionId=${sesion.organizacionId}`);
            document.getElementById("animalId").innerHTML = animales
                .map((a) => `<option value="${a.id}">${escaparHtml(a.nombre)} (${escaparHtml(a.organizacionNombre)})</option>`)
                .join("");
        }

        async function cargarTabla() {
            try {
                const registros = await api.get("/castraciones");
                const cuerpo = document.getElementById("cuerpo-tabla");
                const vacio = document.getElementById("tabla-vacia");

                if (registros.length === 0) {
                    cuerpo.innerHTML = "";
                    vacio.hidden = false;
                    return;
                }
                vacio.hidden = true;

                cuerpo.innerHTML = registros
                    .map(
                        (c) => `
                    <tr>
                        <td>${escaparHtml(c.animalNombre)}</td>
                        <td>${formatearFecha(c.fecha)}</td>
                        <td>${escaparHtml(c.veterinario)}</td>
                        <td>${escaparHtml(c.observaciones)}</td>
                        <td class="acciones">
                            <button class="boton boton-secundario boton-chico" onclick="editar(${c.id})" type="button">Editar</button>
                            <button class="boton boton-peligro boton-chico" onclick="darDeBaja(${c.id})" type="button">Dar de baja</button>
                        </td>
                    </tr>`
                    )
                    .join("");
            } catch (error) {
                mostrarError(error.message);
            }
        }

        document.getElementById("boton-nuevo").addEventListener("click", () => {
            resetearFormulario();
            mostrarFormulario("Nueva castración");
        });

        document.getElementById("boton-cancelar").addEventListener("click", ocultarFormulario);

        document.getElementById("formulario-castracion").addEventListener("submit", async (evento) => {
            evento.preventDefault();
            ocultarMensajes();

            const datos = {
                animalId: Number(document.getElementById("animalId").value),
                fecha: document.getElementById("fecha").value,
                veterinario: document.getElementById("veterinario").value.trim(),
                observaciones: document.getElementById("observaciones").value.trim() || null,
            };

            const id = document.getElementById("castracionId").value;

            try {
                if (id) {
                    await api.put(`/castraciones/${id}`, datos);
                    mostrarExito("Castración actualizada correctamente.");
                } else {
                    await api.post("/castraciones", datos);
                    mostrarExito("Castración registrada correctamente.");
                }
                ocultarFormulario();
                await cargarTabla();
            } catch (error) {
                mostrarError(error.message);
            }
        });

        async function editar(id) {
            ocultarMensajes();
            try {
                const c = await api.get(`/castraciones/${id}`);
                document.getElementById("castracionId").value = c.id;
                document.getElementById("animalId").value = c.animalId;
                document.getElementById("animalId").disabled = true;
                document.getElementById("fecha").value = c.fecha;
                document.getElementById("veterinario").value = c.veterinario;
                document.getElementById("observaciones").value = c.observaciones ?? "";
                mostrarFormulario("Editar castración");
            } catch (error) {
                mostrarError(error.message);
            }
        }

        async function darDeBaja(id) {
            if (!confirm("¿Dar de baja este registro de castración? Se conserva en el historial del animal.")) {
                return;
            }
            ocultarMensajes();
            try {
                await api.del(`/castraciones/${id}`);
                mostrarExito("Registro dado de baja.");
                await cargarTabla();
            } catch (error) {
                mostrarError(error.message);
            }
        }

        function resetearFormulario() {
            document.getElementById("formulario-castracion").reset();
            document.getElementById("castracionId").value = "";
            document.getElementById("animalId").disabled = false;
        }

        function mostrarFormulario(titulo) {
            document.getElementById("titulo-formulario").textContent = titulo;
            document.getElementById("tarjeta-formulario").hidden = false;
            document.getElementById("tarjeta-formulario").scrollIntoView({ behavior: "smooth" });
        }

        function ocultarFormulario() {
            document.getElementById("tarjeta-formulario").hidden = true;
        }

        function mostrarError(mensaje) {
            const elemento = document.getElementById("mensaje-error");
            elemento.textContent = mensaje;
            elemento.hidden = false;
        }

        function mostrarExito(mensaje) {
            const elemento = document.getElementById("mensaje-exito");
            elemento.textContent = mensaje;
            elemento.hidden = false;
        }

        function ocultarMensajes() {
            document.getElementById("mensaje-error").hidden = true;
            document.getElementById("mensaje-exito").hidden = true;
        }
    </script>
</body>
</html>
