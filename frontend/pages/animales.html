<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysRefugios - Animales</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header id="encabezado" class="encabezado"></header>

    <main class="contenedor">
        <div class="barra-herramientas">
            <h1>Animales</h1>
            <button id="boton-nuevo" class="boton" type="button">Nuevo animal</button>
        </div>
        <p class="subtitulo" style="margin-top:0;">
            Para registrar el ingreso de un animal rescatado usá la página Rescates, que carga el animal, el
            rescate y su espacio de tránsito en un solo paso.
        </p>

        <div id="mensaje-error" class="alerta alerta-error" hidden></div>
        <div id="mensaje-exito" class="alerta alerta-exito" hidden></div>
        <div id="mensaje-aviso" class="alerta alerta-aviso" hidden></div>

        <section id="tarjeta-formulario" class="tarjeta" hidden>
            <h2 id="titulo-formulario" style="margin-top:0;">Nuevo animal</h2>
            <form id="formulario-animal">
                <input type="hidden" id="animalId">
                <div class="fila-campos">
                    <div class="campo">
                        <label for="nombre">Nombre *</label>
                        <input type="text" id="nombre" required>
                    </div>
                    <div class="campo">
                        <label for="especie">Especie *</label>
                        <input type="text" id="especie" placeholder="Perro, Gato..." required>
                    </div>
                    <div class="campo">
                        <label for="color">Color</label>
                        <input type="text" id="color" maxlength="50">
                    </div>
                </div>
                <div class="fila-campos">
                    <div class="campo">
                        <label for="sexo">Sexo</label>
                        <select id="sexo">
                            <option value="">Sin especificar</option>
                            <option value="Macho">Macho</option>
                            <option value="Hembra">Hembra</option>
                        </select>
                    </div>
                    <div class="campo">
                        <label for="fechaNacimiento">Fecha de nacimiento (aproximada)</label>
                        <input type="date" id="fechaNacimiento">
                    </div>
                    <div class="campo">
                        <label for="etapaVida">Etapa de vida *</label>
                        <select id="etapaVida" required></select>
                    </div>
                    <div class="campo">
                        <label for="tamanio">Tamaño</label>
                        <select id="tamanio"></select>
                    </div>
                </div>
                <div class="fila-campos">
                    <div class="campo">
                        <label for="estado">Estado *</label>
                        <select id="estado" required></select>
                    </div>
                    <div class="campo">
                        <label for="organizacionId">Organización responsable *</label>
                        <select id="organizacionId" required></select>
                    </div>
                </div>
                <div class="campo">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion"></textarea>
                </div>
                <div class="acciones-formulario">
                    <button type="submit" class="boton">Guardar</button>
                    <button type="button" id="boton-cancelar" class="boton boton-secundario">Cancelar</button>
                </div>
            </form>
        </section>

        <div class="tarjeta">
            <form id="formulario-filtros">
                <div class="fila-campos">
                    <div class="campo">
                        <label for="filtro-nombre">Buscar por nombre</label>
                        <input type="search" id="filtro-nombre" placeholder="Ej.: Luna">
                    </div>
                    <div class="campo">
                        <label for="filtro-estado">Estado</label>
                        <select id="filtro-estado"></select>
                    </div>
                </div>
                <label class="casilla" style="margin:0;">
                    <input type="checkbox" id="casilla-todas">
                    Ver animales de todas las organizaciones
                </label>
            </form>
        </div>

        <div class="tarjeta">
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Especie</th>
                            <th>Etapa</th>
                            <th>Tamaño</th>
                            <th>Estado</th>
                            <th>Organización</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla"></tbody>
                </table>
                <p id="tabla-vacia" class="vacio" hidden>No hay animales registrados todavía.</p>
            </div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/etiquetas.js"></script>
    <script>
        const sesion = inicializarPagina("animales.html");
        let turnoCarga = 0;

        if (sesion) {
            iniciar();
        }

        async function iniciar() {
            document.getElementById("etapaVida").innerHTML = opcionesSelector(ETAPAS_VIDA);
            document.getElementById("tamanio").innerHTML = opcionesSelector(TAMANIOS, "Sin especificar");
            document.getElementById("estado").innerHTML = opcionesSelector(ESTADOS_ANIMAL);
            document.getElementById("filtro-estado").innerHTML = opcionesSelector(ESTADOS_ANIMAL, "Todos los estados");
            try {
                const organizaciones = await api.get("/organizaciones");
                document.getElementById("organizacionId").innerHTML = organizaciones
                    .map((o) => `<option value="${o.id}">${escaparHtml(o.nombre)}</option>`)
                    .join("");
            } catch (error) {
                mostrarError(error.message);
            }
            await cargarTabla();
        }

        async function cargarTabla() {
            const turno = ++turnoCarga;
            try {
                const parametros = new URLSearchParams();
                if (!document.getElementById("casilla-todas").checked) {
                    parametros.set("organizacionId", sesion.organizacionId);
                }
                const nombre = document.getElementById("filtro-nombre").value.trim();
                const estado = document.getElementById("filtro-estado").value;
                if (nombre) {
                    parametros.set("nombre", nombre);
                }
                if (estado) {
                    parametros.set("estado", estado);
                }
                const consulta = parametros.toString();
                const animales = await api.get(`/animales${consulta ? `?${consulta}` : ""}`);
                if (turno !== turnoCarga) {
                    return;
                }
                const filtrando = nombre || estado;
                document.getElementById("tabla-vacia").textContent = filtrando
                    ? "Ningún animal coincide con la búsqueda."
                    : "No hay animales registrados todavía.";
                document.getElementById("tabla-vacia").hidden = animales.length > 0;
                document.getElementById("cuerpo-tabla").innerHTML = animales
                    .map(
                        (a) => `
                    <tr>
                        <td>
                            ${enlaceHistorial(a.id, a.nombre)}
                            ${a.avisoDerivacion ? `<br><span class="etiqueta etiqueta-aviso" title="${escaparHtml(a.avisoDerivacion)}">Debe derivarse</span>` : ""}
                            ${a.alertaCastracionVencida ? `<br><span class="etiqueta etiqueta-peligro" title="Venció el plazo de castración de su adopción">Castración vencida</span>` : ""}
                        </td>
                        <td>${escaparHtml(a.especie)}</td>
                        <td>${etiqueta(ETAPAS_VIDA, a.etapaVida)}</td>
                        <td>${etiqueta(TAMANIOS, a.tamanio)}</td>
                        <td>${etiqueta(ESTADOS_ANIMAL, a.estado)}</td>
                        <td>${escaparHtml(a.organizacionNombre)}</td>
                        <td class="acciones">
                            <a class="boton boton-secundario boton-chico" href="historial.html?animalId=${a.id}">Historial</a>
                            <button class="boton boton-secundario boton-chico" onclick="editar(${a.id})" type="button">Editar</button>
                            <button class="boton boton-peligro boton-chico" onclick="darDeBaja(${a.id})" type="button">Dar de baja</button>
                        </td>
                    </tr>`
                    )
                    .join("");
            } catch (error) {
                mostrarError(error.message);
            }
        }

        document.getElementById("casilla-todas").addEventListener("change", cargarTabla);
        document.getElementById("filtro-estado").addEventListener("change", cargarTabla);
        document.getElementById("filtro-nombre").addEventListener("input", cargarTabla);
        document.getElementById("formulario-filtros").addEventListener("submit", (evento) => evento.preventDefault());

        document.getElementById("boton-nuevo").addEventListener("click", () => {
            resetearFormulario();
            mostrarFormulario("Nuevo animal");
        });

        document.getElementById("boton-cancelar").addEventListener("click", ocultarFormulario);

        document.getElementById("formulario-animal").addEventListener("submit", async (evento) => {
            evento.preventDefault();
            ocultarMensajes();

            const datos = {
                nombre: document.getElementById("nombre").value.trim(),
                especie: document.getElementById("especie").value.trim(),
                sexo: document.getElementById("sexo").value || null,
                fechaNacimiento: document.getElementById("fechaNacimiento").value || null,
                color: document.getElementById("color").value.trim() || null,
                etapaVida: document.getElementById("etapaVida").value,
                tamanio: document.getElementById("tamanio").value || null,
                estado: document.getElementById("estado").value,
                descripcion: document.getElementById("descripcion").value.trim() || null,
                organizacionId: Number(document.getElementById("organizacionId").value),
            };

            const id = document.getElementById("animalId").value;
            try {
                const animal = id ? await api.put(`/animales/${id}`, datos) : await api.post("/animales", datos);
                mostrarExito(id ? "Animal actualizado correctamente." : "Animal registrado correctamente.");
                mostrarAviso(animal.avisoDerivacion);
                ocultarFormulario();
                await cargarTabla();
            } catch (error) {
                mostrarError(error.message);
            }
        });

        async function editar(id) {
            ocultarMensajes();
            try {
                const a = await api.get(`/animales/${id}`);
                document.getElementById("animalId").value = a.id;
                document.getElementById("nombre").value = a.nombre;
                document.getElementById("especie").value = a.especie;
                document.getElementById("sexo").value = a.sexo ?? "";
                document.getElementById("fechaNacimiento").value = a.fechaNacimiento ?? "";
                document.getElementById("color").value = a.color ?? "";
                document.getElementById("etapaVida").value = a.etapaVida;
                document.getElementById("tamanio").value = a.tamanio ?? "";
                document.getElementById("estado").value = a.estado;
                document.getElementById("descripcion").value = a.descripcion ?? "";
                document.getElementById("organizacionId").value = a.organizacionId;
                mostrarFormulario("Editar animal");
            } catch (error) {
                mostrarError(error.message);
            }
        }

        async function darDeBaja(id) {
            if (!confirm("¿Dar de baja este animal? Deja de aparecer en los listados, pero se conserva en el historial.")) {
                return;
            }
            ocultarMensajes();
            try {
                await api.del(`/animales/${id}`);
                mostrarExito("Animal dado de baja.");
                await cargarTabla();
            } catch (error) {
                mostrarError(error.message);
            }
        }

        function resetearFormulario() {
            document.getElementById("formulario-animal").reset();
            document.getElementById("animalId").value = "";
            document.getElementById("estado").value = "EN_ADOPCION";
            document.getElementById("organizacionId").value = sesion.organizacionId;
        }

        function mostrarFormulario(titulo) {
            document.getElementById("titulo-formulario").textContent = titulo;
            document.getElementById("tarjeta-formulario").hidden = false;
            document.getElementById("tarjeta-formulario").scrollIntoView({ behavior: "smooth" });
        }

        function ocultarFormulario() {
            document.getElementById("tarjeta-formulario").hidden = true;
        }

        function mostrarError(mensaje) {
            const elemento = document.getElementById("mensaje-error");
            elemento.textContent = mensaje;
            elemento.hidden = false;
        }

        function mostrarExito(mensaje) {
            const elemento = document.getElementById("mensaje-exito");
            elemento.textContent = mensaje;
            elemento.hidden = false;
        }

        function mostrarAviso(mensaje) {
            const elemento = document.getElementById("mensaje-aviso");
            elemento.textContent = mensaje ?? "";
            elemento.hidden = !mensaje;
        }

        function ocultarMensajes() {
            ["mensaje-error", "mensaje-exito", "mensaje-aviso"].forEach((id) => (document.getElementById(id).hidden = true));
        }
    </script>
</body>
</html>
