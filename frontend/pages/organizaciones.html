<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysRefugios - Organizaciones</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header id="encabezado" class="encabezado"></header>

    <main class="contenedor">
        <div class="barra-herramientas">
            <h1>Organizaciones</h1>
            <button id="boton-nuevo" class="boton" type="button">Nueva organización</button>
        </div>
        <p class="subtitulo" style="margin-top:0;">
            Cada organización solo puede modificar sus propios datos. La etapa de vida que atiende se usa para
            proponer el destino de las derivaciones (RN-03).
        </p>

        <div id="mensaje-error" class="alerta alerta-error" hidden></div>
        <div id="mensaje-exito" class="alerta alerta-exito" hidden></div>

        <section id="tarjeta-formulario" class="tarjeta" hidden>
            <h2 id="titulo-formulario" style="margin-top:0;">Nueva organización</h2>
            <form id="formulario-organizacion">
                <input type="hidden" id="organizacionId">
                <div class="fila-campos">
                    <div class="campo">
                        <label for="nombre">Nombre *</label>
                        <input type="text" id="nombre" maxlength="255" required>
                    </div>
                    <div class="campo">
                        <label for="etapaVidaAtendida">Etapa de vida que atiende</label>
                        <select id="etapaVidaAtendida"></select>
                    </div>
                </div>
                <div class="fila-campos">
                    <div class="campo">
                        <label for="telefono">Teléfono</label>
                        <input type="tel" id="telefono" maxlength="255">
                    </div>
                    <div class="campo">
                        <label for="email">Email</label>
                        <input type="email" id="email" maxlength="150">
                    </div>
                    <div class="campo">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" maxlength="255">
                    </div>
                </div>
                <div class="campo">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion"></textarea>
                </div>
                <div class="acciones-formulario">
                    <button type="submit" class="boton">Guardar</button>
                    <button type="button" id="boton-cancelar" class="boton boton-secundario">Cancelar</button>
                </div>
            </form>
        </section>

        <div class="tarjeta">
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Organización</th>
                            <th>Contacto</th>
                            <th>Dirección</th>
                            <th>Etapa que atiende</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla"></tbody>
                </table>
                <p id="tabla-vacia" class="vacio" hidden>No hay organizaciones registradas todavía.</p>
            </div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/etiquetas.js"></script>
    <script>
        const sesion = inicializarPagina("organizaciones.html");
        const CAMPOS = ["nombre", "descripcion", "telefono", "email", "direccion", "etapaVidaAtendida"];
        let organizaciones = [];

        if (sesion) {
            document.getElementById("etapaVidaAtendida").innerHTML = opcionesSelector(ETAPAS_VIDA, "Todas las etapas");
            cargarTabla();
        }

        async function cargarTabla() {
            try {
                organizaciones = await api.get("/organizaciones");
                document.getElementById("tabla-vacia").hidden = organizaciones.length > 0;
                document.getElementById("cuerpo-tabla").innerHTML = organizaciones
                    .map((o) => {
                        const propia = o.id === sesion.organizacionId;
                        return `
                    <tr>
                        <td>
                            <strong>${escaparHtml(o.nombre)}</strong>${propia ? ` <span class="etiqueta etiqueta-exito">La tuya</span>` : ""}
                            ${o.descripcion ? `<br><span class="ayuda">${escaparHtml(o.descripcion)}</span>` : ""}
                        </td>
                        <td>
                            ${escaparHtml(o.telefono)}
                            ${o.telefono && o.email ? "<br>" : ""}
                            ${escaparHtml(o.email)}
                        </td>
                        <td>${escaparHtml(o.direccion)}</td>
                        <td>${o.etapaVidaAtendida ? etiqueta(ETAPAS_VIDA, o.etapaVidaAtendida) : "Todas"}</td>
                        <td class="acciones">
                            ${propia ? `<button class="boton boton-secundario boton-chico" onclick="editar(${o.id})" type="button">Editar</button>` : ""}
                        </td>
                    </tr>`;
                    })
                    .join("");
            } catch (error) {
                mostrarError(error.message);
            }
        }

        document.getElementById("boton-nuevo").addEventListener("click", () => {
            ocultarMensajes();
            document.getElementById("formulario-organizacion").reset();
            document.getElementById("organizacionId").value = "";
            mostrarFormulario("Nueva organización");
        });

        document.getElementById("boton-cancelar").addEventListener("click", () => {
            document.getElementById("tarjeta-formulario").hidden = true;
        });

        function editar(id) {
            ocultarMensajes();
            const o = organizaciones.find((x) => x.id === id);
            document.getElementById("organizacionId").value = o.id;
            CAMPOS.forEach((campo) => (document.getElementById(campo).value = o[campo] ?? ""));
            mostrarFormulario(`Editar ${o.nombre}`);
        }

        document.getElementById("formulario-organizacion").addEventListener("submit", async (evento) => {
            evento.preventDefault();
            ocultarMensajes();
            const datos = {};
            CAMPOS.forEach((campo) => (datos[campo] = document.getElementById(campo).value.trim() || null));
            const id = document.getElementById("organizacionId").value;
            try {
                if (id) {
                    await api.put(`/organizaciones/${id}`, datos);
                    if (Number(id) === sesion.organizacionId) {
                        sesion.organizacionNombre = datos.nombre;
                        guardarSesion(sesion);
                    }
                    mostrarExito(`Datos de ${datos.nombre} actualizados correctamente.`);
                } else {
                    await api.post("/organizaciones", datos);
                    mostrarExito(`Organización ${datos.nombre} registrada correctamente.`);
                }
                document.getElementById("tarjeta-formulario").hidden = true;
                await cargarTabla();
            } catch (error) {
                mostrarError(error.message);
            }
        });

        function mostrarFormulario(titulo) {
            document.getElementById("titulo-formulario").textContent = titulo;
            document.getElementById("tarjeta-formulario").hidden = false;
            document.getElementById("tarjeta-formulario").scrollIntoView({ behavior: "smooth" });
        }

        function mostrarError(mensaje) {
            const elemento = document.getElementById("mensaje-error");
            elemento.textContent = mensaje;
            elemento.hidden = false;
            elemento.scrollIntoView({ behavior: "smooth", block: "center" });
        }

        function mostrarExito(mensaje) {
            const elemento = document.getElementById("mensaje-exito");
            elemento.textContent = mensaje;
            elemento.hidden = false;
        }

        function ocultarMensajes() {
            document.getElementById("mensaje-error").hidden = true;
            document.getElementById("mensaje-exito").hidden = true;
        }
    </script>
</body>
</html>
