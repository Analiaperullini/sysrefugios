<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysRefugios - Vacunaciones</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header id="encabezado" class="encabezado"></header>

    <main class="contenedor">
        <div class="barra-herramientas">
            <h1>Vacunaciones</h1>
            <button id="boton-nuevo" class="boton" type="button">Nueva vacunación</button>
        </div>
        <p class="subtitulo">
            Historial de vacunas aplicadas por animal (un animal puede tener varios registros a lo largo del tiempo).
        </p>

        <div id="mensaje-error" class="alerta alerta-error" hidden></div>
        <div id="mensaje-exito" class="alerta alerta-exito" hidden></div>

        <section id="tarjeta-formulario" class="tarjeta" hidden>
            <h2 id="titulo-formulario" style="margin-top:0;">Nueva vacunación</h2>
            <form id="formulario-vacunacion">
                <input type="hidden" id="vacunacionId">
                <div class="fila-campos">
                    <div class="campo">
                        <label for="animalId">Animal *</label>
                        <select id="animalId" required></select>
                    </div>
                    <div class="campo">
                        <label for="fecha">Fecha *</label>
                        <input type="date" id="fecha" required>
                    </div>
                    <div class="campo">
                        <label for="vacuna">Vacuna *</label>
                        <input type="text" id="vacuna" maxlength="100" placeholder="Antirrábica, quíntuple..." required>
                    </div>
                    <div class="campo">
                        <label for="dosis">Dosis *</label>
                        <input type="text" id="dosis" maxlength="50" placeholder="Primera dosis, refuerzo..." required>
                    </div>
                </div>
                <div class="campo">
                    <label for="observaciones">Observaciones</label>
                    <textarea id="observaciones"></textarea>
                </div>
                <div class="acciones-formulario">
                    <button type="submit" class="boton">Guardar</button>
                    <button type="button" id="boton-cancelar" class="boton boton-secundario">Cancelar</button>
                </div>
            </form>
        </section>

        <div class="tarjeta">
            <div class="tabla-contenedor">
                <table>
                    <thead>
                        <tr>
                            <th>Animal</th>
                            <th>Fecha</th>
                            <th>Vacuna</th>
                            <th>Dosis</th>
                            <th>Observaciones</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla"></tbody>
                </table>
                <p id="tabla-vacia" class="vacio" hidden>No hay vacunaciones registradas todavía.</p>
            </div>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/etiquetas.js"></script>
    <script>
        const sesion = inicializarPagina("vacunaciones.html");

        if (sesion) {
            iniciar();
        }

        async function iniciar() {
            await cargarAnimales();
            await cargarTabla();
        }

        async function cargarAnimales() {
            const animales = await api.get(`/animales?organizacionId=${sesion.organizacionId}`);
            document.getElementById("animalId").innerHTML = animales
                .map((a) => `<option value="${a.id}">${escaparHtml(a.nombre)} (${escaparHtml(a.organizacionNombre)})</option>`)
                .join("");
        }

        async function cargarTabla() {
            try {
                const registros = await api.get("/vacunaciones");
                const cuerpo = document.getElementById("cuerpo-tabla");
                const vacio = document.getElementById("tabla-vacia");

                if (registros.length === 0) {
                    cuerpo.innerHTML = "";
                    vacio.hidden = false;
                    return;
                }
                vacio.hidden = true;

                cuerpo.innerHTML = registros
                    .map(
                        (v) => `
                    <tr>
                        <td>${escaparHtml(v.animalNombre)}</td>
                        <td>${formatearFecha(v.fecha)}</td>
                        <td>${escaparHtml(v.vacuna)}</td>
                        <td>${escaparHtml(v.dosis)}</td>
                        <td>${escaparHtml(v.observaciones)}</td>
                        <td class="acciones">
                            <button class="boton boton-secundario boton-chico" onclick="editar(${v.id})" type="button">Editar</button>
                            <button class="boton boton-peligro boton-chico" onclick="darDeBaja(${v.id})" type="button">Dar de baja</button>
                        </td>
                    </tr>`
                    )
                    .join("");
            } catch (error) {
                mostrarError(error.message);
            }
        }

        document.getElementById("boton-nuevo").addEventListener("click", () => {
            resetearFormulario();
            mostrarFormulario("Nueva vacunación");
        });

        document.getElementById("boton-cancelar").addEventListener("click", ocultarFormulario);

        document.getElementById("formulario-vacunacion").addEventListener("submit", async (evento) => {
            evento.preventDefault();
            ocultarMensajes();

            const datos = {
                animalId: Number(document.getElementById("animalId").value),
                fecha: document.getElementById("fecha").value,
                vacuna: document.getElementById("vacuna").value.trim(),
                dosis: document.getElementById("dosis").value.trim(),
                observaciones: document.getElementById("observaciones").value.trim() || null,
            };

            const id = document.getElementById("vacunacionId").value;

            try {
                if (id) {
                    await api.put(`/vacunaciones/${id}`, datos);
                    mostrarExito("Vacunación actualizada correctamente.");
                } else {
                    await api.post("/vacunaciones", datos);
                    mostrarExito("Vacunación registrada correctamente.");
                }
                ocultarFormulario();
                await cargarTabla();
            } catch (error) {
                mostrarError(error.message);
            }
        });

        async function editar(id) {
            ocultarMensajes();
            try {
                const v = await api.get(`/vacunaciones/${id}`);
                document.getElementById("vacunacionId").value = v.id;
                document.getElementById("animalId").value = v.animalId;
                document.getElementById("animalId").disabled = true;
                document.getElementById("fecha").value = v.fecha;
                document.getElementById("vacuna").value = v.vacuna;
                document.getElementById("dosis").value = v.dosis;
                document.getElementById("observaciones").value = v.observaciones ?? "";
                mostrarFormulario("Editar vacunación");
            } catch (error) {
                mostrarError(error.message);
            }
        }

        async function darDeBaja(id) {
            if (!confirm("¿Dar de baja este registro de vacunación? Se conserva en el historial del animal.")) {
                return;
            }
            ocultarMensajes();
            try {
                await api.del(`/vacunaciones/${id}`);
                mostrarExito("Registro dado de baja.");
                await cargarTabla();
            } catch (error) {
                mostrarError(error.message);
            }
        }

        function resetearFormulario() {
            document.getElementById("formulario-vacunacion").reset();
            document.getElementById("vacunacionId").value = "";
            document.getElementById("animalId").disabled = false;
        }

        function mostrarFormulario(titulo) {
            document.getElementById("titulo-formulario").textContent = titulo;
            document.getElementById("tarjeta-formulario").hidden = false;
            document.getElementById("tarjeta-formulario").scrollIntoView({ behavior: "smooth" });
        }

        function ocultarFormulario() {
            document.getElementById("tarjeta-formulario").hidden = true;
        }

        function mostrarError(mensaje) {
            const elemento = document.getElementById("mensaje-error");
            elemento.textContent = mensaje;
            elemento.hidden = false;
        }

        function mostrarExito(mensaje) {
            const elemento = document.getElementById("mensaje-exito");
            elemento.textContent = mensaje;
            elemento.hidden = false;
        }

        function ocultarMensajes() {
            document.getElementById("mensaje-error").hidden = true;
            document.getElementById("mensaje-exito").hidden = true;
        }
    </script>
</body>
</html>
